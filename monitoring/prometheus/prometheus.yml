# Prometheus 설정 - Simple Trading Core
global:
  scrape_interval: 10s # 10초마다 메트릭 수집
  evaluation_interval: 10s # 10초마다 규칙 평가

  # 모든 메트릭에 추가될 공통 레이블
  external_labels:
    monitor: 'trading-monitor'
    environment: 'local'


# 스크래핑 대상 설정
scrape_configs:
  # Prometheus 자체 모니터링
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # 통합 애플리케이션 (App Module)
  - job_name: 'simple-trading-core'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: 'trading-core'
          module: 'app'

  # Order Service
  - job_name: 'order-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          service: 'order'
          module: 'order'

  # Matching Service
  - job_name: 'matching-service'
    metrics_path: '/matching/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8082']
        labels:
          service: 'matching'
          module: 'matching'

  # Account Service
  - job_name: 'account-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8083']
        labels:
          service: 'account'
          module: 'account'

  # Kafka Exporter (선택사항 - 별도 설치 필요)
  # - job_name: 'kafka'
  #   static_configs:
  #     - targets: ['kafka-exporter:9308']
  #       labels:
  #         service: 'kafka'
  #         type: 'message-broker'

